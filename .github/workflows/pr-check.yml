name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sourcewise-frontend/package-lock.json
            sourcewise-dashboard/package-lock.json
            sourcewise-backend/node-api/package-lock.json

      - name: Lint Frontend
        working-directory: sourcewise-frontend
        run: |
          npm ci
          npm run lint

      - name: Lint Dashboard
        working-directory: sourcewise-dashboard
        run: |
          npm ci
          npm run lint

      - name: Install Backend Dependencies
        working-directory: sourcewise-backend/node-api
        run: |
          npm ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sourcewise-frontend/package-lock.json
            sourcewise-dashboard/package-lock.json

      - name: Build Frontend
        working-directory: sourcewise-frontend
        run: |
          npm ci
          npm run build

      - name: Build Dashboard
        working-directory: sourcewise-dashboard
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: sourcewise-frontend/dist/

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: sourcewise-dashboard/dist/

