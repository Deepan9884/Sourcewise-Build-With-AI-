name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sourcewise-frontend/package-lock.json
            sourcewise-dashboard/package-lock.json
            sourcewise-backend/node-api/package-lock.json

      - name: Lint Frontend
        working-directory: sourcewise-frontend
        run: |
          npm ci
          npm run lint

      - name: Lint Dashboard
        working-directory: sourcewise-dashboard
        run: |
          npm ci
          npm run lint

      - name: Install Backend Dependencies
        working-directory: sourcewise-backend/node-api
        run: |
          npm ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sourcewise-frontend/package-lock.json
            sourcewise-dashboard/package-lock.json

      - name: Build Frontend
        working-directory: sourcewise-frontend
        run: |
          npm ci
          npm run build

      - name: Build Dashboard
        working-directory: sourcewise-dashboard
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: sourcewise-frontend/dist/

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: sourcewise-dashboard/dist/

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sourcewise-backend/node-api/package-lock.json

      - name: Install Backend Dependencies
        working-directory: sourcewise-backend/node-api
        run: npm ci

      - name: Run Backend Tests
        working-directory: sourcewise-backend/node-api
        run: npm test

  test-dashboard:
    name: Test Dashboard
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sourcewise-dashboard/package-lock.json

      - name: Run Dashboard Tests
        working-directory: sourcewise-dashboard
        run: |
          npm ci
          npm test -- --run

  test-ai:
    name: Test AI Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Service Dependencies
        working-directory: sourcewise-backend/python-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Service Tests
        working-directory: sourcewise-backend/python-ai
        run: |
          AI_TESTS=$(find . -name "test_*.py" -not -path "./venv/*" -not -path "./__pycache__/*")
          if [ -n "$AI_TESTS" ]; then
            echo "Running AI tests:"
            echo "$AI_TESTS"
            python -m pytest test_*.py app/services/test_*.py tests/ -v
          else
            echo "No AI test files found — skipping"
            exit 1
          fi
